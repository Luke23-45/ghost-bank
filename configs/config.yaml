defaults:
  - data: cifar100
  - model: cifar_resnet
  - method: baseline
  - training: cifar100
  - output: default
  - _self_

# Global verbosity toggle. When true, the runner and replay banks print
# per-class / per-chunk timing diagnostics; when false (default), the
# final run log only shows progress bars and one-line status messages.
debug: false

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    disabled: true
  hydra_logging:
    disabled: true
