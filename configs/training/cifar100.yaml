learning_rate: 0.1
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
# lr_scheduler: cosine
max_epochs: 70
log_every_n_steps: 10
gradient_clip_val: 1.0
enable_progress_bar: true
progress_refresh_rate: 1
accelerator: gpu
devices: 1
precision: 16-mixed

# Early stopping is disabled for this experiment to ensure
# representations are fully trained for the baseline comparisons.
# (Removed early_stopping block)

# Logging / verbosity control ------------------------------------------------
#   level:  debug | info | warning | error | critical | none
#   When level >= warning, progress bars, model summaries, and PL banners
#   are automatically suppressed regardless of the toggles above.
#   Overridable at deployment via env var: GHOST_BANK_LOG_LEVEL
logging:
  level: warning
